# yaml-language-server: $schema=https://schemas.pennsieve.io/app-manifest/v1.json
schemaVersion: "1.0"
application:
  name: Single-cell Cell Typing
  description: >-
    Labels every cell or nucleus of a single-cell / single-nucleus RNA-seq dataset with a cell
    type, the step after sc-integrate in the Single-nucleus Atlas Mapping workflow. With a labelled
    reference linked (an .h5ad with counts and a cell type column, or a previous run's model), the
    labels are transferred cell by cell with CellTypist (Dominguez Conde et al. 2022) or scANVI
    label transfer by scArches surgery (scvi-tools; Xu et al. 2021, Lotfollahi et al. 2022), and
    cells below MIN_SCORE stay Unassigned. Without one, each cluster is typed from marker gene sets
    (a markers.csv, or a built-in set from published atlases: human dorsal root ganglion, human knee
    joint, or broad types from PanglaoDB). Writes the cells with cell_type, cell_type_score and
    cell_type_source, labels.csv for sc-markers, st-compare and the reports, a reusable reference
    model (reference.h5ad, scANVI weights, cell2location signatures) and an annotation summary
    with figures. Two variants: CPU (CellTypist by default) and GPU (scANVI by default).
  type: processor
  tags:
    - single-cell
    - single-nucleus
    - transcriptomics
    - genomics
    - cell-typing
    - label-transfer
    - reference-mapping
    - neuroscience
    - pain
    - musculoskeletal
runtime:
  # Shared by both variants (below); these are the cpu variant's values. Measured in the linux/amd64
  # image under emulation on an M-series Mac (README "Runtime"): markers mode on the C2 DRG demo
  # (12 samples, 18,439 nuclei x 18,082 genes) 37 s, 1.4 GB peak; reference mode holds the
  # reference subsample (<= MAX_CELLS_PER_TYPE per type) plus the query's counts on 3,000 genes.
  cpu: 4096
  memory: 16384
  computeTypes:
    - standard
  timeoutSeconds: 28800
parameters:
  - name: MODE
    type: string
    label: Mode
    description: >-
      auto: reference mode when a reference is linked, else markers mode. reference: label
      transfer from the linked reference (fails without one). markers: cluster-level typing from
      marker sets even when a reference is linked.
    defaultValue: auto
    validValues: [auto, reference, markers]
  - name: METHOD
    type: string
    label: Label-transfer method
    description: >-
      Reference mode only. celltypist: a logistic-regression classifier trained on the reference
      (fast on CPU; the cpu variant's default). scanvi: scVI + scANVI on the reference, the query
      mapped by scArches surgery (integrates batches; best on a GPU, the gpu variant's default).
      A linked model with a scanvi/ folder is reused as is by scanvi.
    defaultValue: celltypist
    validValues: [celltypist, scanvi]
  - name: MARKER_SET
    type: string
    label: Built-in marker set
    description: >-
      Markers mode only, when no markers.csv is linked. drg-human: 20 human dorsal root ganglion
      types (neuron subtypes incl. nociceptors, satellite glia, Schwann cells, stromal, immune;
      Bhuiyan et al. 2024, Tavares-Ferreira et al. 2022, Avraham et al. 2022). knee-human: 14 human
      knee joint types (chondrocyte states, synovial fibroblasts, macrophages, immune, vascular,
      adipocytes; Ji et al. 2019, Chou et al. 2020, Zhang et al. 2019, Emont et al. 2022). broad:
      16 broad types of any tissue (PanglaoDB). none: only a linked markers.csv.
    defaultValue: broad
    validValues: [broad, drg-human, knee-human, none]
  - name: CELL_TYPE_COLUMN
    type: string
    label: Reference cell type column
    description: Column of the reference .h5ad's obs with each cell's type (ignored for a linked sc-annotate model).
    defaultValue: cell_type
  - name: REFERENCE_BATCH_COLUMN
    type: string
    label: Reference batch column
    description: >-
      Optional column of the reference's obs with its batch (donor, sample, chemistry), the batch
      covariate of scVI. Empty: the reference is one batch. The query's batches are its samples.
    defaultValue: ""
  - name: MIN_SCORE
    type: number
    label: Minimum confidence
    description: >-
      Reference mode: a cell whose best label has a probability below this is Unassigned
      (CellTypist's or scANVI's probability; 0 keeps every call).
    defaultValue: 0.5
    min: 0
    max: 1
  - name: MARGIN
    type: number
    label: Marker margin
    description: >-
      Markers mode: a cluster is called its best marker set only when that set's mean z-score is
      positive and at least this much above the runner-up; otherwise Unassigned. Lower it to name
      more clusters, raise it to be stricter between related subtypes.
    defaultValue: 0.2
    min: 0
  - name: MIN_GENES_PRESENT
    type: integer
    label: Minimum marker genes present
    description: "Markers mode: a marker set is scored only when at least this many of its (positively weighted) genes are in the data."
    defaultValue: 2
    min: 1
  - name: MAX_CELLS_PER_TYPE
    type: integer
    label: Reference cells per type
    description: >-
      The reference is subsampled (seeded) to at most this many cells per type before training,
      and the model's reference.h5ad keeps at most this many; types with fewer than 10 cells are
      dropped.
    defaultValue: 2000
    min: 10
  - name: MAX_EPOCHS
    type: integer
    label: Reference scVI epochs
    description: scanvi only. Training epochs of the reference scVI model; 0 = scvi-tools' rule (400, fewer above 20,000 cells).
    defaultValue: 0
    min: 0
  - name: QUERY_EPOCHS
    type: integer
    label: Query mapping epochs
    description: scanvi only. Epochs of the scArches query training (the scvi-tools tutorial uses 100).
    defaultValue: 100
    min: 1
  - name: SEED
    type: integer
    label: Random seed
    description: Seed for subsampling, marker control genes and model training.
    defaultValue: 42
  - name: THREADS
    type: integer
    label: Threads
    description: CPU threads for BLAS, numba, torch and CellTypist; 0 = from the container's CPU quota.
    defaultValue: 0
    min: 0
    max: 64
# Each input in its own folder (placement: subfolder) when linked; without links the files are found
# by name anywhere under INPUT_DIR (a reference as reference.h5ad or in a reference/ folder).
inputs:
  - name: cells
    description: >-
      sc-integrate's <sample_id>.h5ad, one per sample: X log-normalized, layers["counts"],
      obs["cluster"], obsm["X_umap"]. Genes present in every sample are used.
    formats:
      - format_3590
    mediaTypes:
      - application/x-hdf5
    placement: subfolder
    required: true
  - name: reference
    description: >-
      Optional. A labelled single-cell .h5ad of the same tissue and species with raw counts (X,
      layers["counts"] or raw.X) and a cell type column (CELL_TYPE_COLUMN), e.g. a CELLxGENE
      download (Ensembl var_names with feature_name work); or the model output of an earlier
      sc-annotate run (reference.h5ad, scanvi/), which is reused.
    formats:
      - format_3590
    mediaTypes:
      - application/x-hdf5
      - text/csv
      - application/json
      - application/octet-stream
    placement: subfolder
    required: false
  - name: markers
    description: >-
      Optional markers.csv: cell_type, gene[, weight], one gene per row; a negative weight marks a
      gene the type should not express. Replaces the built-in MARKER_SET.
    mediaTypes:
      - text/csv
    placement: subfolder
    required: false
outputs:
  - name: cells
    description: >-
      Every <sample_id>.h5ad as read, plus obs["cell_type"], obs["cell_type_score"] (0-1) and
      obs["cell_type_source"] (reference, model or markers), and uns["pennsieve"]["annotation"].
    formats:
      - format_3590
    mediaTypes:
      - application/x-hdf5
      - application/json
  - name: labels
    description: labels.csv (sample_id, obs_id, cluster, cell_type, cell_type_score), provenance.json.
    mediaTypes:
      - text/csv
      - application/json
  - name: model
    description: >-
      reference.h5ad (counts and obs cell_type, batch; at most MAX_CELLS_PER_TYPE cells per type:
      the reference in reference mode, the labelled cells in markers mode), signatures.csv (mean
      counts per cell of each type, cell2location's reference format), reference_summary.csv,
      scanvi/ when scANVI ran (model.pt for scvi-tools, weights.pt + setup.json for reuse here),
      provenance.json. Link it to the reference input of a later run or of cell2location.
    mediaTypes:
      - application/x-hdf5
      - text/csv
      - application/json
      - application/octet-stream
  - name: annotation
    description: >-
      summary.json, cell_types_by_sample.csv (sample_id, cell_type, n_obs, fraction),
      confusion.csv (cluster, cell_type, n_obs, mean_score, fraction_of_cluster), clusters.csv,
      marker_scores.csv (markers mode: cluster, marker_set, mean_z), umap_cell_type.png,
      cell_types_by_sample.png, score_histogram.png, provenance.json.
    mediaTypes:
      - text/csv
      - image/png
      - application/json
variants:
  - id: cpu
    name: CPU
    default: true
    description: CPU-only PyTorch on a standard task; CellTypist label transfer by default.
    build:
      args:
        TORCH_FLAVOUR: cpu
    runtime:
      computeTypes: [standard]
  - id: gpu
    name: GPU (scANVI)
    description: CUDA PyTorch on an NVIDIA GPU (T4 or newer); scANVI label transfer by default.
    build:
      args:
        TORCH_FLAVOUR: cuda
    runtime:
      computeTypes: [gpu]
      memory: 14336
    parameters:
      METHOD:
        defaultValue: scanvi
